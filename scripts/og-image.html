<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Hanken+Grotesk:wght@700;800&display=block" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;background:#073E2B;font-family:"Hanken Grotesk",sans-serif}
  .wrap{position:relative;width:1200px;height:630px;display:grid;grid-template-columns:600px 600px}
  .left{background:#073E2B;color:#F5F4EC;padding:64px 40px 0 64px;display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:18px}
  .brand img{height:76px}
  .wm{font-weight:800;letter-spacing:.08em;font-size:30px;line-height:1}
  .sub{margin-top:8px;font-weight:700;font-size:12.5px;letter-spacing:.16em;color:rgba(245,244,236,.72)}
  h1{font-family:"Fraunces",serif;font-weight:600;font-size:70px;line-height:1;letter-spacing:-.025em;margin-top:78px;font-variation-settings:"WONK" 0}
  .line{display:block;width:420px;height:4px;background:#9FC63A;border-radius:4px;margin-top:22px}
  .meta{margin-top:auto;margin-bottom:56px;font-weight:700;font-size:20px;color:#9FC63A;letter-spacing:.02em}
  .right{background:url("../public/images/01-STOCK-white-brick-home-black-mulch-beds-boxwood-urns-HERO-1280.webp") 72% 55%/cover}
  .hatch{position:absolute;left:0;right:0;bottom:0;height:14px;background:#073E2B repeating-linear-gradient(135deg,#9FC63A 0 8px,transparent 8px 15px)}
</style></head>
<body><div class="wrap">
  <div class="left">
    <div class="brand"><img src="../public/images/00-logo-logo-tree-shovel-transparent.png" alt=""><div><div class="wm">POTOMAC GREEN</div><div class="sub">LANDSCAPING &amp; HANDYMAN SERVICES</div></div></div>
    <h1>One call.<br>More gets done.</h1>
    <span class="line"></span>
    <div class="meta">Potomac · Bethesda · Rockville · Silver Spring</div>
  </div>
  <div class="right"></div>
  <div class="hatch"></div>
</div></body></html>
